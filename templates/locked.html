<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Account Bloccato</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7f9;
            font-family: 'Segoe UI', sans-serif;
            color: #24313a;
        }
        .card {
            width: min(92vw, 560px);
            padding: 40px;
            background: #fff;
            border-top: 6px solid #dc3545;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(31, 45, 61, 0.12);
            text-align: center;
        }
        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #fdecee;
            color: #dc3545;
            font-size: 2rem;
            font-weight: 700;
        }
        .status {
            margin: 0 0 10px;
            color: #dc3545;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 1.75rem;
        }
        p {
            margin: 0;
            color: #5b6770;
            line-height: 1.6;
        }
        .note {
            margin-top: 26px;
            padding: 16px;
            border: 1px solid #e3e9ee;
            border-radius: 10px;
            background: #f8fafc;
            color: #5b6770;
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: left;
        }
        .note strong { color: #24313a; }
        code {
            padding: 2px 5px;
            border-radius: 4px;
            background: #e9eef2;
            font-size: 0.88em;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">!</div>
        <p class="status">403 · Accesso bloccato</p>
        <h1>Hai effettuato troppi tentativi</h1>
        <p>L'account è bloccato dopo 5 tentativi falliti. Contatta l'assistenza per ripristinare l'accesso.</p>

        <div class="note">
            <strong>Nota demo:</strong> il blocco è persistente. Per ripartire, elimina
            <code>database.json</code> e riavvia il server.
        </div>
    </main>
</body>
</html>
