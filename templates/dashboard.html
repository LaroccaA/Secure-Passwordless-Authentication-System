<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Area Protetta</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7f9;
            font-family: 'Segoe UI', sans-serif;
            color: #24313a;
        }
        .card {
            width: min(92vw, 560px);
            padding: 40px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(31, 45, 61, 0.12);
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #e8f7ee;
            color: #1e7d4a;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        h1 {
            margin: 20px 0 10px;
            font-size: 2rem;
        }
        p {
            margin: 0;
            color: #5b6770;
            line-height: 1.6;
        }
        .meta {
            display: grid;
            gap: 10px;
            margin: 28px 0;
            padding: 18px;
            border: 1px solid #e3e9ee;
            border-radius: 12px;
            background: #f8fafc;
            text-align: left;
        }
        .meta div {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-size: 0.95rem;
        }
        .meta span { color: #6b7780; }
        .meta strong { color: #24313a; }
        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 8px;
            background: #dc3545;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        .btn:hover { background: #b02a37; }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">Sessione attiva</span>
        <h1>Benvenuto nella tua area protetta!</h1>
        <p>Accesso effettuato come <strong>{{ user }}</strong>.</p>

        <div class="meta">
            <div><span>Metodo di accesso</span><strong>TOTP</strong></div>
            <div><span>Durata sessione</span><strong>5 minuti</strong></div>
            <div><span>Cookie</span><strong>HttpOnly · SameSite=Lax</strong></div>
        </div>

        <a href="/logout" class="btn">Logout</a>
    </main>
</body>
</html>
