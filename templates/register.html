<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Configurazione Sicura</title>
    <style>
        body { 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f9;
            font-family: 'Segoe UI', sans-serif;
        }
        .card { 
            background: white;
             padding: 2rem;
              border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
             text-align: center; max-width: 600px;
        }
        img {   border: 10px solid #fff;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0,0,0,0.05); 
            }
        .loader {   border: 3px solid #f3f3f3;
                    border-top: 3px solid #3498db;
                    border-radius: 50%;
                    width: 20px;
                    height: 20px;
                    animation: spin 2s linear infinite;
                    display: inline-block;
                    vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h2>Attiva Accesso</h2>
        <p>Inquadra il QR Code con la tua App.</p>
        
        <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
        
        <div style="margin-top: 20px;">
            <p><span class="loader"></span> In attesa della prima verifica...</p>
        </div>

        <form action="/verify-setup" method="POST">
            <input type="text" name="token" placeholder="Inserisci il codice per attivare" 
                   style="padding: 10px; border-radius: 5px; border: 1px solid #ddd; width: 80%;" required>
            <button type="submit" style="margin-top: 10px; padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">Attiva Ora</button>
        </form>
    </div>
</body>
</html>
